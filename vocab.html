  </head>
  <body>
  <nav class="sidebar">
      <a href="index.html" class="nav-item">
      <img src="static/imgs/home_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="Home" width="30" height="30" />

    <a data-external-link="https://www.gpeclub.com" href="#" class="nav-item">
      <img src="static/imgs/auto_awesome_24dp_FFFFFF.svg" alt="AI" width="30" height="30" />

    <a href="#" class="nav-item">
      <img src="static/imgs/settings_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="Settings" width="30" height="30" />
      <span>Settings</span>
    </a>
  </nav>
  <div style="padding-left: 90px">
        <div class="flashcard-container">
            
            <div class="dropdown top1">
                <!-- The button text is set dynamically based on the query parameter -->
                <button class="dropdown-toggle" id="dropdown-toggle" ></button>
                <ul class="dropdown-menu" id="dropdown-menu">
                  <!-- Items will be generated dynamically -->
                </ul>
              </div>
                <div id="response-1"></div>
                <div class="col-lg-3 mx-auto">
                    <div id="progressInfo" style="padding-bottom: 10px"></div>
                    <div class="progress" role="progressbar" aria-label="Progress 20px high" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                      <div class="progress-bar" style="width: 25%" id="progress"></div>
                    </div>
                    <br>
                </div>

              <button id="known" type="button" class="button2" style="margin-right: 10px">Know (1)</button>
              <button id="unknown" type="button" class="button2" >Don't Know (2)</button>
            <br>
            <div style="align-items: end; padding-bottom: 25px" >
                <div id="numKnown" class="count"></div>
                <div id="numUnknown" class="count"></div>
            </div>

            <div class="flashcard" id="flashcard">
              <div class="front" id="front" style="align-content: center">
                <!-- Word will be displayed here -->
              </div>
              <div class="back" id="back" style="align-content: center">
                <!-- Definition will be displayed here -->
              </div>
            </div>
            <div class="bottom1" style="">
                <div style="text-align: center; position: relative;justify-content: center; top: 15%">
              <button id="prevBtn" class="button2 lg" style="margin-right: 10px">(<-) Previous</button>
              <button id="nextBtn" class="button2 lg">Next (->)</button>
                </div>
            </div>
            <br><br>
            <div class="form-check">
              <input class="checkbox2" type="checkbox" value="" id="random">
              <label class="checkbox2">
                Random Shuffle
              </label>
            </div>
            <div class="form-check" style="padding-bottom: 25px">
              <input class="checkbox2" type="checkbox" value="" id="practiceUnknown">
              <label class="checkbox2">
                Only Unknown Words checked
              </label>
            </div>
            <!-- Button trigger modal -->
            <button type="button" class="button2" id="clear" data-bs-dismiss="modal">Reset Data</button>
            <br><br><br><br>
        </div>

        <script>

        </script>
          </div>

    <!-- You can also require other files to run in this process -->
    <script src="static/js/renderer.js"></script>
    <script src="static/js/vocab.js"></script>
      <script src="static/js/index.js"></script>
  </body>
</html>
