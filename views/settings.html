  <div style="padding-left: 90px; text-align: center;">
    <h1 data-i18n="title"></h1>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div class="textLine">
        <p style="display: inline-block; margin-right: 10px; font-size: 25px; font-weight: bold" data-i18n="developerMode"></p>
        <label class="switch" style="display: inline-block">
          <!-- Give the input an ID to target it from JavaScript -->
          <input type="checkbox" id="devToolsSwitch">
          <span class="slider"></span>
        </label>
      </div>
      <div class="textLine">
        <p style="display: inline-block; margin-right: 10px; font-size: 25px; font-weight: bold;" data-i18n="showGPEBall"></p>
        <label class="switch" style="display: inline-block">
          <!-- Give the input an ID to target it from JavaScript -->
          <input type="checkbox" id="GPEBall">
          <span class="slider"></span>
        </label>
      </div>
      <div class="textLine">
        <p style="display: inline-block; margin-right: 10px; font-size: 25px; font-weight: bold;" data-i18n="language"></p>
        <div class="dropdown">
          <button class="dropdown-toggle" id="languageSelector">English</button>
          <ul class="dropdown-menu">
            <li class="dropdown-item" data-lang="en">English</li>
            <li class="dropdown-item" data-lang="zh">中文</li>
          </ul>
        </div>
    </div>
    
    </div>
  </div>

    <!-- You can also require other files to run in this process -->
    <script src="../static/js/i18n.js"></script>
    <script src="../static/js/renderer.js"></script>
    <script src="../static/js/index.js"></script>
    <script>
      const devToolsSwitch = document.getElementById('devToolsSwitch');
      devToolsSwitch.addEventListener('change', (event) => {
        window.electronAPI.sendToggleDevTools(event.target.checked);
      });
      const ball = sessionStorage.getItem("ballChecked") === "true" || sessionStorage.getItem("ballChecked") === null;

      const GPEBall = document.getElementById('GPEBall');
      GPEBall.checked = ball;
      GPEBall.addEventListener('change', function () {
        sessionStorage.setItem("ballChecked", GPEBall.checked);
        console.log("GPE Ball is", GPEBall.checked ? "enabled" : "disabled");
        if (GPEBall.checked) {
            window.electronAPI.createBallWindow();
        } else {
          window.electronAPI.deleteBallWindow();
        }
      });

      // Language selector functionality
      document.addEventListener('DOMContentLoaded', function() {
        const languageSelector = document.getElementById('languageSelector');
        const languageItems = document.querySelectorAll('.dropdown-item');
        
        // Load saved language preference or default to English
        const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';
        const savedLanguageText = document.querySelector(`.dropdown-item[data-lang="${savedLanguage}"]`)?.textContent || 'English';
        languageSelector.textContent = savedLanguageText;
        
        // Handle language selection
        languageItems.forEach(item => {
          item.addEventListener('click', function() {
            const lang = this.getAttribute('data-lang');
            languageSelector.textContent = this.textContent;
            localStorage.setItem('selectedLanguage', lang);
            
            // Here you would trigger your i18n translation function
            // For example: changeLanguage(lang);
            console.log(`Language changed to: ${lang}`);
            window.api.setLanguage(lang);
            location.reload();
          });
        });
      });
    </script>
  </body>
