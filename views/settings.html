<div style="padding-left: 90px; text-align: center;">
  <h1>Settings</h1>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="align-items: center;display: flex"  >
      <p style="display: inline-block; margin-right: 10px; font-size: 25px; font-weight: bold">Developer mode</p>
      <label class="switch" style="display: inline-block">
        <!-- Give the input an ID to target it from JavaScript -->
        <input type="checkbox" id="devToolsSwitch">
        <span class="slider"></span>
      </label>
    </div>
    <div style="align-items: center;display: flex">
      <p style="display: inline-block; margin-right: 10px; font-size: 25px; font-weight: bold;">Show GPE Ball</p>
      <label class="switch" style="display: inline-block">
        <!-- Give the input an ID to target it from JavaScript -->
        <input type="checkbox" id="GPEBall">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  </div>

    <!-- You can also require other files to run in this process -->
    <script src="../static/js/renderer.js"></script>
    <script src="../static/js/index.js"></script>
    <script>
      const devToolsSwitch = document.getElementById('devToolsSwitch');
      devToolsSwitch.addEventListener('change', (event) => {
        window.electronAPI.sendToggleDevTools(event.target.checked);
      });
      const ball = sessionStorage.getItem("ballChecked") === "true" || sessionStorage.getItem("ballChecked") === null;

      const GPEBall = document.getElementById('GPEBall');
      GPEBall.checked = ball;
      GPEBall.addEventListener('change', function () {
        sessionStorage.setItem("ballChecked", GPEBall.checked);
        console.log("GPE Ball is", GPEBall.checked ? "enabled" : "disabled");
        if (GPEBall.checked) {
            window.electronAPI.createBallWindow();
        } else {
          window.electronAPI.deleteBallWindow();
        }
      });

    </script>
  </body>
